[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "study-assistant"
version = "0.1.0"
description = "Local RAG study assistant for course notes and textbooks."
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "pydantic",
  "pypdf",
  "docling",
  "sentence-transformers",
  "chromadb",
  "bm25s",
  "nltk",
  "requests",
  "ollama",
  "mcp",
  "pyyaml",
  "tqdm",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
